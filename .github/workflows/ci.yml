name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: verify the formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        # Внутри — и проверка формулы, и сверка браузерного движка с эталоном на Python.
        run: python tests/test_formula.py

      - name: Константы формулы совпадают с эталоном
        run: |
          python3 - <<'PY'
          import re, sys

          with open("docs/calc.js", encoding="utf-8") as fh:
              js = fh.read()
          with open("tests/test_formula.py", encoding="utf-8") as fh:
              py = fh.read()

          def js_const(name):
              m = re.search(rf"{name}\s*=\s*([0-9_]+(?:\.[0-9]+)?)", js)
              assert m, f"в calc.js нет {name}"
              return float(m.group(1).replace("_", ""))

          def py_const(name):
              m = re.search(rf"^{name}\s*=\s*([0-9_]+(?:\.[0-9]+)?)", py, re.M)
              assert m, f"в test_formula.py нет {name}"
              return float(m.group(1).replace("_", ""))

          for name in ("Q", "FIXED_MONTH", "PRODUCTIVE_HOURS"):
              a, b = js_const(name), py_const(name)
              assert a == b, f"{name}: движок {a} != эталон {b}"
              print(f"{name} = {a} — совпадает")
          PY

  pages:
    name: publish the calculator
    needs: formula
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
